name: Validate and prepare package
on:
    push:
    pull_request:
    workflow_dispatch:
    schedule:
        - cron: '30 6 * * 1'
concurrency:
    group: validate-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
permissions:
    contents: read
jobs:
    package:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.21.0
                  package-manager-cache: false
            - run: |
                  echo "EDITRA_NODE24=$(command -v node)" >> "$GITHUB_ENV"
                  npm install --prefix "$RUNNER_TEMP/editra-npm24" npm@11.6.2 --ignore-scripts --no-audit --no-fund
                  echo "EDITRA_NPM24_CLI=$RUNNER_TEMP/editra-npm24/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
            - uses: actions/setup-node@v7
              with:
                  node-version: 20.20.2
                  cache: npm
            - run: |
                  echo "EDITRA_NODE20=$(command -v node)" >> "$GITHUB_ENV"
                  echo "EDITRA_NPM_CLI=$(npm root -g)/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run validate -- --compatibility
              env:
                  CHROME_BIN: /usr/bin/google-chrome
            - run: npm run verify:evidence
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: package-and-evidence
                  path: |
                      artifacts/
                      !artifacts/consumers/**
                      !artifacts/toolchains/**
