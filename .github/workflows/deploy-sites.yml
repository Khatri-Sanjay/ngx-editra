name: Deploy static site to Vercel
on:
    workflow_run:
        workflows: [Validate and prepare package]
        types: [completed]
        branches: [main]
    workflow_dispatch:
        inputs:
            site:
                description: Site to deploy
                required: true
                type: choice
                options: [documentation, playground]
            production:
                description: Deploy to production (otherwise create a preview)
                type: boolean
                default: false
permissions:
    contents: read
jobs:
    deploy:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository)
        strategy:
            fail-fast: false
            matrix:
                site: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.site) || '["documentation","playground"]') }}
        concurrency:
            group: deploy-${{ matrix.site }}-${{ (github.event_name == 'workflow_run' || inputs.production) && 'production' || 'preview' }}
            cancel-in-progress: false
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: ${{ (github.event_name == 'workflow_run' || inputs.production) && 'production' || 'preview' }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.21.0
                  package-manager-cache: false
            - run: |
                  echo "EDITRA_NODE24=$(command -v node)" >> "$GITHUB_ENV"
                  npm install --prefix "$RUNNER_TEMP/editra-npm24" npm@11.6.2 --ignore-scripts --no-audit --no-fund
                  echo "EDITRA_NPM24_CLI=$RUNNER_TEMP/editra-npm24/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
            - uses: actions/setup-node@v7
              with:
                  node-version: 20.20.2
                  cache: npm
            - run: npm ci
            - run: npm run build:site -- "$SITE"
              env:
                  SITE: ${{ matrix.site }}
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.21.0
                  package-manager-cache: false
            - name: Deploy prepared static output
              working-directory: artifacts/sites/${{ matrix.site }}
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  DOCS_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
                  PLAYGROUND_PROJECT_ID: ${{ secrets.VERCEL_PLAYGROUND_PROJECT_ID }}
                  SITE: ${{ matrix.site }}
                  PRODUCTION: ${{ github.event_name == 'workflow_run' || inputs.production }}
              run: |
                  set -euo pipefail
                  if [ "$SITE" = documentation ]; then
                    export VERCEL_PROJECT_ID="$DOCS_PROJECT_ID"
                  else
                    export VERCEL_PROJECT_ID="$PLAYGROUND_PROJECT_ID"
                  fi
                  for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
                    if [ -z "${!name}" ]; then
                      echo "::error::Missing $name. Configure the matching GitHub Actions repository secret."
                      exit 1
                    fi
                  done
                  args=(deploy --prebuilt --yes "--token=$VERCEL_TOKEN")
                  if [ "$PRODUCTION" = true ]; then args+=(--prod); fi
                  npm exec --yes --package=vercel@64.4.0 -- vercel "${args[@]}"
