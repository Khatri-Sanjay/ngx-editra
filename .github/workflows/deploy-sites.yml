name: Deploy static site to Vercel
on:
    workflow_dispatch:
        inputs:
            site:
                description: Site to deploy
                required: true
                type: choice
                options: [documentation, playground]
            production:
                description: Deploy to production (otherwise create a preview)
                type: boolean
                default: false
permissions:
    contents: read
concurrency:
    group: deploy-${{ inputs.site }}-${{ inputs.production }}
    cancel-in-progress: false
jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: ${{ inputs.production && 'production' || 'preview' }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.21.0
                  package-manager-cache: false
            - run: |
                  echo "EDITRA_NODE24=$(command -v node)" >> "$GITHUB_ENV"
                  npm install --prefix "$RUNNER_TEMP/editra-npm24" npm@11.6.2 --ignore-scripts --no-audit --no-fund
                  echo "EDITRA_NPM24_CLI=$RUNNER_TEMP/editra-npm24/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
            - uses: actions/setup-node@v7
              with:
                  node-version: 20.20.2
                  cache: npm
            - run: npm ci
            - run: npm run build:site -- "$SITE"
              env:
                  SITE: ${{ inputs.site }}
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.21.0
                  package-manager-cache: false
            - name: Deploy prepared static output
              working-directory: artifacts/sites/${{ inputs.site }}
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  DOCS_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
                  PLAYGROUND_PROJECT_ID: ${{ secrets.VERCEL_PLAYGROUND_PROJECT_ID }}
                  SITE: ${{ inputs.site }}
                  PRODUCTION: ${{ inputs.production }}
              run: |
                  if [ "$SITE" = documentation ]; then
                    export VERCEL_PROJECT_ID="$DOCS_PROJECT_ID"
                  else
                    export VERCEL_PROJECT_ID="$PLAYGROUND_PROJECT_ID"
                  fi
                  test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
                  args=(deploy --prebuilt --yes --token "$VERCEL_TOKEN")
                  if [ "$PRODUCTION" = true ]; then args+=(--prod); fi
                  npm exec --yes --package=vercel@64.4.0 -- vercel "${args[@]}"
